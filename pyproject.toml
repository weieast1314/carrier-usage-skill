[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carrier-usage-skill"
version = "0.4.1"
description = "可扩展的运营商用量与资费查询 Agent Skill"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
web-login = ["playwright>=1.48,<2"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pyyaml>=6,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
carrier-usage = "carrier_usage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["carrier-usage-skill/carrier_usage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["carrier-usage-skill/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["carrier-usage-skill"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["carrier-usage-skill/carrier_usage"]
