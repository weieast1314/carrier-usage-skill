name: 发布到 SkillHub

# 推送形如 v0.4.3 的 tag 时，自动发布对应版本到 SkillHub。
# 前置条件：在仓库 Settings → Secrets and variables → Actions 中添加
#   SKILLHUB_TOKEN  —— skillhub 登录密钥（skillhub login --key 所用）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: 发布 Skill 到 SkillHub
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 校验 tag 与 SKILL.md 版本一致
        id: verify
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SKILL_VERSION="$(grep -m1 '^version:' carrier-usage-skill/SKILL.md | sed 's/version:[[:space:]]*//')"
          echo "tag 版本: $TAG"
          echo "SKILL.md 版本: $SKILL_VERSION"
          if [ "$TAG" != "$SKILL_VERSION" ]; then
            echo "错误：tag ($TAG) 与 SKILL.md version ($SKILL_VERSION) 不一致。" >&2
            exit 1
          fi

      - name: 安装 skillhub CLI
        run: |
          # skillhub 是独立 CLI（非 PyPI 包）。install.sh 在部分区域返回 566，
          # 改为从 COS 发布源直接下载 tar.gz 安装。
          set -euo pipefail
          BASE_DIR="$HOME/.skillhub"
          mkdir -p "$BASE_DIR" "$HOME/.local/bin"
          VERSION_JSON="$(curl -fsSL --retry 3 --retry-delay 5 \
            https://skillhub-1388575217.cos.ap-guangzhou.myqcloud.com/version.json)"
          ZIP_URL="$(printf '%s' "$VERSION_JSON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["zip_url"])')"
          echo "下载 skillhub CLI: $ZIP_URL"
          curl -fsSL --retry 3 --retry-delay 5 "$ZIP_URL" -o /tmp/skillhub-cli.tar.gz
          rm -rf /tmp/skillhub-cli-extract
          mkdir -p /tmp/skillhub-cli-extract
          tar -xzf /tmp/skillhub-cli.tar.gz -C /tmp/skillhub-cli-extract
          cp -R /tmp/skillhub-cli-extract/cli/. "$BASE_DIR/"
          # 创建 skillhub 包装脚本（与本地一致：调用 skills_store_cli.py）
          printf '#!/usr/bin/env bash\nexec python3 "%s/skills_store_cli.py" "$@"\n' "$BASE_DIR" > "$HOME/.local/bin/skillhub"
          chmod +x "$HOME/.local/bin/skillhub"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          skillhub --version

      - name: 登录 skillhub
        run: skillhub login --key "$SKILLHUB_TOKEN"
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}

      - name: 发布（自动排除 .venv/缓存，版本说明自动提取）
        run: |
          # 版本说明优先取 git tag annotation；若无则取 CHANGELOG.md 对应段落；最后兜底占位。
          # 建议打 annotated tag：git tag -a vX.Y.Z -m "本次真实版本说明"
          bash scripts/publish_skill.sh
