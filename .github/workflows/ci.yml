name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} 质量检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        working-directory: carrier-usage-skill
        run: python -m pip install -e '.[dev]'
      - name: Ruff 检查
        working-directory: carrier-usage-skill
        run: python -m ruff check carrier_usage scripts tests
      - name: Ruff 格式检查
        working-directory: carrier-usage-skill
        run: python -m ruff format --check carrier_usage scripts tests
      - name: mypy 类型检查
        working-directory: carrier-usage-skill
        run: python -m mypy carrier_usage
      - name: 测试
        working-directory: carrier-usage-skill
        run: python -m pytest -v

  package:
    name: 构建与依赖审计
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        working-directory: carrier-usage-skill
        run: python -m pip install -e '.[dev]'
      - name: 构建发行包
        working-directory: carrier-usage-skill
        run: python -m build
      - name: 审计依赖
        run: python -m pip_audit

  secrets:
    name: Gitleaks 秘密扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 扫描秘密
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
